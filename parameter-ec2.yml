AWSTemplateFormatVersion: '2010-09-09'
Description: Launch an EC2

Parameters:
  InstanceType:
    Description: EC2 instance type
    Type: String
    Default: t3.micro
    AllowedValues:
      - t3.micro
      - t3.small
      - t3.medium

  KeyName:
    Description: Name of an existing EC2 KeyPair for SSH access
    Type: AWS::EC2::KeyPair::KeyName

  SubnetId:
    Description: ID of an existing Subnet in your VPC
    Type: AWS::EC2::Subnet::Id

  SecurityGroupIds:
    Description: List of existing Security Group IDs (must belong to the same VPC as the Subnet)
    Type: List<AWS::EC2::SecurityGroup::Id>


Resources:
  MyEC2Instance:
    Type: AWS::EC2::Instance
    Properties:
      ImageId: ami-0df8a753693e6366d
      InstanceType: !Ref InstanceType
      KeyName: !Ref KeyName
      SubnetId: !Ref SubnetId
      SecurityGroupIds: !Ref SecurityGroupIds
      Tags:
        - Key: Name
          Value: Parameters-srv

